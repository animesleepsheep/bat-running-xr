name: XR-000 Android build
on:
  workflow_dispatch:
  push:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/xr-android.yml'
permissions:
  contents: read
concurrency:
  group: xr-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1' 'ndk;28.1.13356709' 'cmake;3.10.2.4988404'
      - name: Build and verify both debug APKs
        run: bash tools/build.sh
      - name: Upload signed APKs and verification report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BAT_RUNNING_XR000_APKs
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/*.log
          if-no-files-found: error
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: XR000_failure_logs
          path: dist/*.log
          if-no-files-found: ignore
