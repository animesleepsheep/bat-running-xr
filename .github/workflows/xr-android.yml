name: XR-000 Android build
on:
  workflow_dispatch:
  push:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/xr-android.yml'
permissions:
  contents: read
concurrency:
  group: xr-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Bootstrap Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          mkdir -p "$SDK"
          if ! test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"; then
            tmp="$(mktemp -d)"
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$tmp/tools.zip"
            unzip -q "$tmp/tools.zip" -d "$tmp"
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$tmp/cmdline-tools" "$SDK/cmdline-tools/latest"
            rm -rf "$tmp"
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1' 'ndk;28.1.13356709' 'cmake;3.10.2.4988404'
      - name: Build and verify both debug APKs
        run: bash tools/build.sh
      - name: Upload signed APKs and verification report
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: BAT_RUNNING_XR000_APKs
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/*.log
          if-no-files-found: error
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: XR000_failure_logs
          path: dist/*.log
          if-no-files-found: ignore
